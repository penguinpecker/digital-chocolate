<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Digital Chocolate">
  <defs>
    <linearGradient id="chocBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A85D26"/>
      <stop offset="0.5" stop-color="#6F381C"/>
      <stop offset="1" stop-color="#3A1A0F"/>
    </linearGradient>
    <linearGradient id="caramel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE19E"/>
      <stop offset="1" stop-color="#C48F3C"/>
    </linearGradient>
    <radialGradient id="cheekGloss" cx="0.3" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#FFD7B0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD7B0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#E6B85A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E6B85A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark backdrop -->
  <rect width="256" height="256" rx="56" fill="#1A0E08"/>
  <rect width="256" height="256" rx="56" fill="url(#bgGlow)"/>

  <!-- Confetti sprinkles around the character -->
  <g>
    <circle cx="40" cy="58" r="3.5" fill="#FFD884"/>
    <circle cx="220" cy="195" r="3" fill="#C084FF"/>
    <circle cx="30" cy="180" r="2.5" fill="#5CC8FF"/>
    <circle cx="222" cy="55" r="2.5" fill="#FF8B6B"/>
    <rect x="200" y="32" width="5" height="5" rx="1" fill="#FFD884" transform="rotate(35 202 34)"/>
    <rect x="40" y="200" width="5" height="5" rx="1" fill="#FFD884" transform="rotate(-25 42 202)"/>
    <circle cx="48" cy="128" r="2" fill="#FFD884"/>
    <circle cx="210" cy="128" r="2" fill="#FFD884"/>
  </g>

  <!-- Chocolate character group with subtle tilt -->
  <g transform="rotate(-7 128 128)">
    <!-- Floor shadow -->
    <ellipse cx="128" cy="221" rx="74" ry="6.5" fill="#000" opacity="0.45"/>

    <!-- Caramel/inner-filling layer behind the bite (so the bite "reveals" caramel) -->
    <path d="M 150 36 L 220 36 L 220 100
             C 200 96, 184 86, 174 72
             C 162 62, 154 50, 150 36 Z"
          fill="url(#caramel)" stroke="#A36F2C" stroke-width="1.5"/>

    <!-- Chocolate body with bite (top-right chunk missing) -->
    <path d="M 76 36
             L 150 36
             C 154 50, 162 62, 174 72
             C 184 86, 200 96, 220 100
             L 220 178
             Q 220 214, 184 214
             L 72 214
             Q 36 214, 36 178
             L 36 72
             Q 36 36, 76 36 Z"
          fill="url(#chocBody)" stroke="#1A0907" stroke-width="3"/>

    <!-- Soft top-left gloss -->
    <ellipse cx="86" cy="86" rx="46" ry="34" fill="url(#cheekGloss)"/>

    <!-- Left eye -->
    <ellipse cx="92" cy="128" rx="16" ry="21" fill="#FFFFFF"/>
    <ellipse cx="95" cy="133" rx="8.5" ry="11" fill="#1A0907"/>
    <circle cx="98" cy="128" r="3.2" fill="#FFFFFF"/>

    <!-- Right eye -->
    <ellipse cx="158" cy="128" rx="16" ry="21" fill="#FFFFFF"/>
    <ellipse cx="161" cy="133" rx="8.5" ry="11" fill="#1A0907"/>
    <circle cx="164" cy="128" r="3.2" fill="#FFFFFF"/>

    <!-- Blush cheeks -->
    <ellipse cx="68" cy="160" rx="12" ry="6" fill="#FF8B6B" opacity="0.55"/>
    <ellipse cx="178" cy="160" rx="12" ry="6" fill="#FF8B6B" opacity="0.55"/>

    <!-- Big open smile -->
    <path d="M 92 168 Q 124 200, 162 168 Q 144 188, 124 188 Q 104 188, 92 168 Z"
          fill="#1A0907"/>
    <!-- Tongue -->
    <path d="M 110 180 Q 124 196, 142 180 Q 128 188, 110 180 Z"
          fill="#FF8B6B"/>
    <!-- Tooth -->
    <rect x="120" y="172" width="6" height="7" rx="1.5" fill="#FFFFFF"/>
  </g>
</svg>
